name: CI - Integracao Continua

on:
  push:
    branches:
      - main
      - homolog
  pull_request:
    branches:
      - main
      - homolog

jobs:
  backend-ci:
    name: Backend (FastAPI, Ruff, Bandit & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r scripts/requirements.txt

      - name: Analise estatica e Linting (Ruff)
        run: |
          ruff check backend/ app/ scripts/ || true

      - name: Auditoria de Seguranca (Bandit)
        run: |
          bandit -r backend/app -ll -ii || true

      - name: Executar Testes Automatizados (Pytest)
        run: |
          pytest backend/tests -v --junitxml=backend-test-results.xml

  motor-c-ci:
    name: Motor de Alocacao (C + OpenMP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Instalar dependencias de compilacao C e OpenMP
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Compilar Motor C com OpenMP
        run: |
          cd backend/motor_alocacao
          make clean
          make
          ls -la motor_alocacao.so

  scripts-ci:
    name: Validacao de Scripts e Ferramentas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar sintaxe dos scripts
        run: |
          python -m py_compile scripts/clickup_sync.py
