services:
  db:
    image: postgres:16-alpine
    container_name: sigaas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_salas}
      POSTGRES_USER: ${POSTGRES_USER:-gestao_salas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestao_salas} -d ${POSTGRES_DB:-gestao_salas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigaas_network

  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
    container_name: sigaas_backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gestao_salas}
      - POSTGRES_USER=${POSTGRES_USER:-gestao_salas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_local_only}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gestao_salas}:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/${POSTGRES_DB:-gestao_salas}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-min-32-chars}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    networks:
      - sigaas_network

  frontend:
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
    container_name: sigaas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - sigaas_network

  cron:
    build:
      context: ../..
      dockerfile: docker/cron/Dockerfile
    container_name: sigaas_cron
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gestao_salas}
      - POSTGRES_USER=${POSTGRES_USER:-gestao_salas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_local_only}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gestao_salas}:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/${POSTGRES_DB:-gestao_salas}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigaas_network

networks:
  sigaas_network:
    driver: bridge

volumes:
  db_data:
